<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KL Facility Heatmap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #fff; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 14px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; white-space: nowrap; }
    header h1 span { color: #6c63ff; }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      background: #2a2d3e;
      color: #aaa;
    }
    .filter-btn:hover { transform: translateY(-1px); }
    .filter-btn.active { color: #fff; border-color: currentColor; }

    .filter-btn[data-key="house_price"].active  { background: #e74c3c33; color: #e74c3c; border-color: #e74c3c; }
    .filter-btn[data-key="cafe"].active          { background: #e67e2233; color: #e67e22; border-color: #e67e22; }
    .filter-btn[data-key="laundry"].active       { background: #3498db33; color: #3498db; border-color: #3498db; }
    .filter-btn[data-key="mamak"].active         { background: #2ecc7133; color: #2ecc71; border-color: #2ecc71; }
    .filter-btn[data-key="clinic"].active        { background: #9b59b633; color: #9b59b6; border-color: #9b59b6; }
    .filter-btn[data-key="gym"].active           { background: #f39c1233; color: #f39c12; border-color: #f39c12; }
    .filter-btn[data-key="convenience"].active   { background: #1abc9c33; color: #1abc9c; border-color: #1abc9c; }

    #map { flex: 1; width: 100%; }

    .legend {
      position: absolute;
      bottom: 30px;
      right: 16px;
      background: #1a1d27ee;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 1000;
      font-size: 12px;
      min-width: 160px;
    }
    .legend h4 { font-size: 13px; margin-bottom: 8px; color: #fff; }
    .legend-bar {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #0000ff80, #00ff0080, #ffff0080, #ff000080);
      margin-bottom: 6px;
    }
    .legend-labels { display: flex; justify-content: space-between; color: #aaa; }

    .info-panel {
      position: absolute;
      top: 80px;
      left: 16px;
      background: #1a1d27ee;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 1000;
      font-size: 12px;
      max-width: 220px;
    }
    .info-panel h4 { font-size: 13px; color: #6c63ff; margin-bottom: 6px; }
    .info-panel p { color: #ccc; line-height: 1.6; }
    .info-panel .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #6c63ff33;
      color: #6c63ff;
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <h1>🗺️ KL <span>Facility</span> Heatmap</h1>
  <div class="filters">
    <button class="filter-btn active" data-key="house_price">🏠 House Price</button>
    <button class="filter-btn" data-key="cafe">☕ Cafes</button>
    <button class="filter-btn" data-key="laundry">👕 Laundry</button>
    <button class="filter-btn" data-key="mamak">🍜 Mamak</button>
    <button class="filter-btn" data-key="clinic">🏥 Clinic</button>
    <button class="filter-btn" data-key="gym">💪 Gym</button>
    <button class="filter-btn" data-key="convenience">🏪 Convenience</button>
  </div>
</header>

<div id="map"></div>

<div class="legend">
  <h4 id="legend-title">🏠 House Price Density</h4>
  <div class="legend-bar"></div>
  <div class="legend-labels"><span>Low</span><span>High</span></div>
</div>

<div class="info-panel">
  <h4>💡 How to use</h4>
  <p>Select a facility filter to see its density across Kuala Lumpur.</p>
  <p style="margin-top:6px">🔴 <b>Hot</b> = High density<br>🔵 <b>Cool</b> = Low / missing</p>
  <div class="badge">Hackathon Demo</div>
</div>

<script>
// ──────────────────────────────────────────
// MAP INIT
// ──────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([3.1390, 101.6869], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// Apply dark mode CSS filter to the map container
map.getContainer().style.filter = 'invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.05)';

// Fix: markers/heatmap need counter-invert so they show correct colors
map.getPanes().overlayPane.style.filter = 'invert(1) hue-rotate(180deg)';
map.getPanes().markerPane.style.filter  = 'invert(1) hue-rotate(180deg)';

// ──────────────────────────────────────────
// DUMMY DATA GENERATOR
// Clusters of points around KL landmarks
// ──────────────────────────────────────────
function jitter(lat, lng, n, spread, intensity) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    pts.push([
      lat + (Math.random() - 0.5) * spread,
      lng + (Math.random() - 0.5) * spread,
      intensity * (0.5 + Math.random() * 0.5)
    ]);
  }
  return pts;
}

// KL area centers: [lat, lng, label]
const areas = {
  klcc:         [3.1578,  101.7119],
  bukit_bintang:[3.1466,  101.7100],
  chow_kit:     [3.1659,  101.6986],
  mid_valley:   [3.1178,  101.6774],
  bangsar:      [3.1299,  101.6778],
  mont_kiara:   [3.1728,  101.6536],
  pj_ss2:       [3.1099,  101.6244],
  kepong:       [3.2100,  101.6330],
  wangsa_maju:  [3.1927,  101.7388],
  ampang:       [3.1500,  101.7550],
  setapak:      [3.2020,  101.7102],
  puchong:      [3.0299,  101.6218],
  sri_petaling: [3.0850,  101.6900],
  ttdi:         [3.1402,  101.6304],
  hartamas:     [3.1620,  101.6513],
  desa_park:    [3.1335,  101.6564],
};

// Each facility: define which areas are dense, medium, sparse (gaps = opportunity)
const data = {
  house_price: [
    ...jitter(...areas.klcc,         80, 0.025, 1.0),
    ...jitter(...areas.bukit_bintang, 60, 0.020, 0.9),
    ...jitter(...areas.mont_kiara,    70, 0.030, 0.85),
    ...jitter(...areas.bangsar,       55, 0.022, 0.8),
    ...jitter(...areas.ttdi,          40, 0.020, 0.7),
    ...jitter(...areas.hartamas,      40, 0.022, 0.75),
    ...jitter(...areas.ampang,        35, 0.025, 0.65),
    ...jitter(...areas.mid_valley,    30, 0.018, 0.6),
    ...jitter(...areas.wangsa_maju,   25, 0.025, 0.55),
    ...jitter(...areas.pj_ss2,        20, 0.028, 0.5),
    ...jitter(...areas.kepong,        15, 0.030, 0.4),
    ...jitter(...areas.setapak,       15, 0.025, 0.45),
    ...jitter(...areas.chow_kit,      30, 0.015, 0.6),
    ...jitter(...areas.sri_petaling,  10, 0.020, 0.35),
    ...jitter(...areas.puchong,       10, 0.030, 0.3),
  ],
  cafe: [
    ...jitter(...areas.bukit_bintang, 80, 0.018, 1.0),
    ...jitter(...areas.bangsar,       70, 0.020, 0.9),
    ...jitter(...areas.klcc,          60, 0.022, 0.85),
    ...jitter(...areas.ttdi,          50, 0.018, 0.8),
    ...jitter(...areas.mont_kiara,    45, 0.022, 0.75),
    ...jitter(...areas.hartamas,      40, 0.020, 0.7),
    ...jitter(...areas.desa_park,     35, 0.018, 0.65),
    ...jitter(...areas.mid_valley,    30, 0.015, 0.6),
    // GAPS — opportunity zones
    ...jitter(...areas.kepong,         8, 0.030, 0.2),
    ...jitter(...areas.setapak,        6, 0.025, 0.15),
    ...jitter(...areas.chow_kit,      12, 0.015, 0.25),
    ...jitter(...areas.puchong,        5, 0.030, 0.1),
    ...jitter(...areas.sri_petaling,   7, 0.020, 0.2),
  ],
  laundry: [
    ...jitter(...areas.chow_kit,      60, 0.015, 0.9),
    ...jitter(...areas.wangsa_maju,   55, 0.025, 0.85),
    ...jitter(...areas.setapak,       50, 0.025, 0.8),
    ...jitter(...areas.kepong,        45, 0.030, 0.75),
    ...jitter(...areas.pj_ss2,        40, 0.028, 0.7),
    ...jitter(...areas.puchong,       35, 0.030, 0.65),
    ...jitter(...areas.sri_petaling,  30, 0.020, 0.6),
    // GAPS
    ...jitter(...areas.mont_kiara,     5, 0.022, 0.1),
    ...jitter(...areas.bangsar,        6, 0.020, 0.15),
    ...jitter(...areas.ttdi,           8, 0.018, 0.2),
    ...jitter(...areas.hartamas,       4, 0.022, 0.1),
    ...jitter(...areas.desa_park,      5, 0.018, 0.12),
  ],
  mamak: [
    ...jitter(...areas.chow_kit,      90, 0.015, 1.0),
    ...jitter(...areas.kepong,        70, 0.030, 0.9),
    ...jitter(...areas.setapak,       65, 0.025, 0.85),
    ...jitter(...areas.wangsa_maju,   60, 0.025, 0.8),
    ...jitter(...areas.pj_ss2,        55, 0.028, 0.75),
    ...jitter(...areas.bukit_bintang, 45, 0.018, 0.7),
    ...jitter(...areas.ampang,        40, 0.025, 0.65),
    ...jitter(...areas.mid_valley,    35, 0.015, 0.6),
    // GAPS
    ...jitter(...areas.mont_kiara,     5, 0.022, 0.1),
    ...jitter(...areas.bangsar,        8, 0.020, 0.15),
    ...jitter(...areas.ttdi,           7, 0.018, 0.12),
    ...jitter(...areas.desa_park,      4, 0.018, 0.1),
  ],
  clinic: [
    ...jitter(...areas.klcc,          50, 0.022, 0.9),
    ...jitter(...areas.bukit_bintang, 45, 0.018, 0.85),
    ...jitter(...areas.mid_valley,    55, 0.015, 1.0),
    ...jitter(...areas.bangsar,       40, 0.020, 0.8),
    ...jitter(...areas.pj_ss2,        35, 0.028, 0.7),
    ...jitter(...areas.wangsa_maju,   30, 0.025, 0.65),
    ...jitter(...areas.ampang,        30, 0.025, 0.6),
    // GAPS
    ...jitter(...areas.kepong,        10, 0.030, 0.2),
    ...jitter(...areas.setapak,        8, 0.025, 0.18),
    ...jitter(...areas.puchong,        6, 0.030, 0.15),
    ...jitter(...areas.chow_kit,      12, 0.015, 0.25),
    ...jitter(...areas.sri_petaling,   5, 0.020, 0.12),
  ],
  gym: [
    ...jitter(...areas.mont_kiara,    70, 0.022, 1.0),
    ...jitter(...areas.bangsar,       60, 0.020, 0.9),
    ...jitter(...areas.klcc,          55, 0.022, 0.85),
    ...jitter(...areas.ttdi,          45, 0.018, 0.8),
    ...jitter(...areas.bukit_bintang, 50, 0.018, 0.85),
    ...jitter(...areas.mid_valley,    40, 0.015, 0.75),
    ...jitter(...areas.hartamas,      35, 0.022, 0.7),
    // GAPS
    ...jitter(...areas.kepong,         5, 0.030, 0.1),
    ...jitter(...areas.setapak,        4, 0.025, 0.08),
    ...jitter(...areas.chow_kit,       6, 0.015, 0.12),
    ...jitter(...areas.puchong,        7, 0.030, 0.15),
    ...jitter(...areas.wangsa_maju,    8, 0.025, 0.18),
    ...jitter(...areas.sri_petaling,   4, 0.020, 0.1),
  ],
  convenience: [
    ...jitter(...areas.klcc,          70, 0.022, 1.0),
    ...jitter(...areas.bukit_bintang, 65, 0.018, 0.95),
    ...jitter(...areas.chow_kit,      60, 0.015, 0.9),
    ...jitter(...areas.wangsa_maju,   50, 0.025, 0.8),
    ...jitter(...areas.mid_valley,    55, 0.015, 0.85),
    ...jitter(...areas.setapak,       40, 0.025, 0.7),
    ...jitter(...areas.kepong,        35, 0.030, 0.65),
    ...jitter(...areas.pj_ss2,        45, 0.028, 0.75),
    ...jitter(...areas.ampang,        35, 0.025, 0.65),
    // GAPS
    ...jitter(...areas.mont_kiara,    10, 0.022, 0.2),
    ...jitter(...areas.hartamas,       8, 0.022, 0.15),
    ...jitter(...areas.desa_park,      6, 0.018, 0.12),
    ...jitter(...areas.puchong,       12, 0.030, 0.25),
  ],
};

// ──────────────────────────────────────────
// HEATMAP LAYER MANAGEMENT
// ──────────────────────────────────────────
let currentLayer = null;

const layerConfig = {
  house_price:  { gradient: { 0.2: '#3a0ca3', 0.4: '#7209b7', 0.6: '#f72585', 0.8: '#ff6b35', 1.0: '#ff0000' }, label: '🏠 House Price Density' },
  cafe:         { gradient: { 0.2: '#001845', 0.4: '#023e8a', 0.6: '#0077b6', 0.8: '#ff8800', 1.0: '#e67e22' }, label: '☕ Cafe Density' },
  laundry:      { gradient: { 0.2: '#001d3d', 0.4: '#003566', 0.6: '#0077b6', 0.8: '#00b4d8', 1.0: '#90e0ef' }, label: '👕 Laundry Density' },
  mamak:        { gradient: { 0.2: '#1b4332', 0.4: '#2d6a4f', 0.6: '#52b788', 0.8: '#95d5b2', 1.0: '#2ecc71' }, label: '🍜 Mamak Density' },
  clinic:       { gradient: { 0.2: '#10002b', 0.4: '#3c096c', 0.6: '#7b2d8b', 0.8: '#c77dff', 1.0: '#9b59b6' }, label: '🏥 Clinic Density' },
  gym:          { gradient: { 0.2: '#7f4f24', 0.4: '#b6811a', 0.6: '#e9c46a', 0.8: '#f4a261', 1.0: '#f39c12' }, label: '💪 Gym Density' },
  convenience:  { gradient: { 0.2: '#004b3a', 0.4: '#007f5f', 0.6: '#00b87c', 0.8: '#1abc9c', 1.0: '#20e0a0' }, label: '🏪 Convenience Density' },
};

function showLayer(key) {
  if (currentLayer) map.removeLayer(currentLayer);

  const pts = data[key];
  const cfg = layerConfig[key];

  currentLayer = L.heatLayer(pts, {
    radius: 35,
    blur: 25,
    maxZoom: 15,
    max: 1.0,
    gradient: cfg.gradient
  }).addTo(map);

  document.getElementById('legend-title').textContent = cfg.label;
}

// ──────────────────────────────────────────
// FILTER BUTTON WIRING
// ──────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showLayer(btn.dataset.key);
  });
});

// Initial load
showLayer('house_price');

// ──────────────────────────────────────────
// AREA LABELS (subtle markers)
// ──────────────────────────────────────────
const areaLabels = [
  { pos: areas.klcc,          name: 'KLCC' },
  { pos: areas.bukit_bintang, name: 'Bukit Bintang' },
  { pos: areas.chow_kit,      name: 'Chow Kit' },
  { pos: areas.mid_valley,    name: 'Mid Valley' },
  { pos: areas.bangsar,       name: 'Bangsar' },
  { pos: areas.mont_kiara,    name: 'Mont Kiara' },
  { pos: areas.kepong,        name: 'Kepong' },
  { pos: areas.wangsa_maju,   name: 'Wangsa Maju' },
  { pos: areas.ampang,        name: 'Ampang' },
  { pos: areas.setapak,       name: 'Setapak' },
  { pos: areas.puchong,       name: 'Puchong' },
  { pos: areas.ttdi,          name: 'TTDI' },
  { pos: areas.pj_ss2,        name: 'PJ SS2' },
];

areaLabels.forEach(({ pos, name }) => {
  L.marker(pos, {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        color: rgba(255,255,255,0.7);
        font-size: 11px;
        font-weight: 600;
        font-family: 'Segoe UI', sans-serif;
        white-space: nowrap;
        text-shadow: 0 0 6px #000, 0 0 12px #000;
        letter-spacing: 0.5px;
        pointer-events: none;
      ">${name}</div>`,
      iconAnchor: [0, 0]
    })
  }).addTo(map);
});
</script>
</body>
</html>
