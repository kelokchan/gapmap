<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GapMap</title>
    <meta name="description" content="GapMap — find the gaps in any city. Visualise facility density across neighbourhoods: house prices, cafes, clinics, gyms and more." />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f1117;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 14px 20px;
        background: #1a1d27;
        border-bottom: 1px solid #2a2d3e;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
      }
      header h1 span {
        color: #6c63ff;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        flex: 1;
      }
      .filter-btn {
        padding: 7px 16px;
        border-radius: 20px;
        border: 2px solid transparent;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
        background: #2a2d3e;
        color: #aaa;
      }
      .filter-btn:hover {
        transform: translateY(-1px);
      }
      .filter-btn.active {
        color: #fff;
        border-color: currentColor;
      }

      .filter-btn[data-key="house_price"].active {
        background: #e74c3c33;
        color: #e74c3c;
        border-color: #e74c3c;
      }
      .filter-btn[data-key="cafe"].active {
        background: #e67e2233;
        color: #e67e22;
        border-color: #e67e22;
      }
      .filter-btn[data-key="laundry"].active {
        background: #3498db33;
        color: #3498db;
        border-color: #3498db;
      }
      .filter-btn[data-key="mamak"].active {
        background: #2ecc7133;
        color: #2ecc71;
        border-color: #2ecc71;
      }
      .filter-btn[data-key="clinic"].active {
        background: #9b59b633;
        color: #9b59b6;
        border-color: #9b59b6;
      }
      .filter-btn[data-key="gym"].active {
        background: #f39c1233;
        color: #f39c12;
        border-color: #f39c12;
      }
      .filter-btn[data-key="convenience"].active {
        background: #1abc9c33;
        color: #1abc9c;
        border-color: #1abc9c;
      }

      #map {
        flex: 1;
        width: 100%;
      }

      .legend {
        position: absolute;
        bottom: 30px;
        right: 16px;
        background: #1a1d27ee;
        border: 1px solid #2a2d3e;
        border-radius: 10px;
        padding: 12px 16px;
        z-index: 1000;
        font-size: 12px;
        min-width: 160px;
      }
      .legend h4 {
        font-size: 13px;
        margin-bottom: 8px;
        color: #fff;
      }
      .legend-bar {
        width: 100%;
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(
          to right,
          #0000ff80,
          #00ff0080,
          #ffff0080,
          #ff000080
        );
        margin-bottom: 6px;
      }
      .legend-labels {
        display: flex;
        justify-content: space-between;
        color: #aaa;
      }

      .info-panel {
        position: absolute;
        top: 80px;
        left: 16px;
        background: #1a1d27ee;
        border: 1px solid #2a2d3e;
        border-radius: 10px;
        padding: 12px 16px;
        z-index: 1000;
        font-size: 12px;
        max-width: 220px;
      }
      .info-panel h4 {
        font-size: 13px;
        color: #6c63ff;
        margin-bottom: 6px;
      }
      .info-panel p {
        color: #ccc;
        line-height: 1.6;
      }
      .info-panel .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        background: #6c63ff33;
        color: #6c63ff;
        margin-top: 4px;
        font-weight: 600;
      }

  </head>
  <body>
    <header>
      <h1>🗺️ Gap<span>Map</span></h1>
      <div class="filters">
        <button class="filter-btn active" data-key="house_price">
          🏠 House Price
        </button>
        <button class="filter-btn" data-key="cafe">☕ Cafes</button>
        <button class="filter-btn" data-key="laundry">👕 Laundry</button>
        <button class="filter-btn" data-key="mamak">🍜 Mamak</button>
        <button class="filter-btn" data-key="clinic">🏥 Clinic</button>
        <button class="filter-btn" data-key="gym">💪 Gym</button>
        <button class="filter-btn" data-key="convenience">
          🏪 Convenience
        </button>
      </div>
    </header>

    <div id="map"></div>

    <div class="legend">
      <h4 id="legend-title">🏠 House Price Density</h4>
      <div class="legend-bar"></div>
      <div class="legend-labels"><span>Low</span><span>High</span></div>
    </div>

    <div class="info-panel">
      <h4>💡 How to use</h4>
      <p>Select a facility filter to see its density across the city.</p>
      <p style="margin-top: 6px">
        🔴 <b>Hot</b> = High density<br />🔵 <b>Cool</b> = Low / missing
      </p>
      <div class="badge">Hackathon Demo</div>
    </div>

      // MAP INIT

      const map = L.map("map", { zoomControl: true }).setView(
        [3.139, 101.6869],
        12,
      );

      // Esri dark basemap: no API key, no Referer needed (OSM blocks file:// opens with "Access blocked")
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",

          attribution:
            "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors",
          maxZoom: 16,
        },
      ).addTo(map);

      // DATA GENERATOR
      // Clusters of points around area landmarks
      // ──────────────────────────────────────────
      function jitter(lat, lng, n, spread, intensity) {
        const pts = [];
        for (let i = 0; i < n; i++) {
          pts.push([
            lat + (Math.random() - 0.5) * spread,
            lng + (Math.random() - 0.5) * spread,
            intensity * (0.5 + Math.random() * 0.5),
          ]);
        }
        return pts;
      }

          ...jitter(...areas.pandan_indah,        45, 0.022, 0.68),
          ...jitter(...areas.usj,                 40, 0.025, 0.65),
          ...jitter(...areas.sri_petaling,        40, 0.020, 0.65),
          ...jitter(...areas.puchong,             45, 0.030, 0.68),
          ...jitter(...areas.bukit_jalil,         40, 0.025, 0.65),
          ...jitter(...areas.seri_kembangan,      35, 0.025, 0.58),
          // Gaps — low density in low-walkability premium suburbs
          ...jitter(...areas.mont_kiara,          14, 0.022, 0.22),
          ...jitter(...areas.hartamas,            12, 0.022, 0.20),
          ...jitter(...areas.desa_park,           10, 0.018, 0.18),
          ...jitter(...areas.pj_damansara,        12, 0.022, 0.20),
          ...jitter(...areas.bangsar_south,       10, 0.020, 0.18),
          ...jitter(...areas.kl_eco_city,         10, 0.015, 0.18),
        ],
      };

      // ──────────────────────────────────────────
      // HEATMAP LAYER MANAGEMENT
      // ──────────────────────────────────────────
      let currentLayer = null;

      const layerConfig = {
        house_price: {
          gradient: {
            0.2: "#3a0ca3",
            0.4: "#7209b7",
            0.6: "#f72585",
            0.8: "#ff6b35",
            1.0: "#ff0000",
          },
          label: "🏠 House Price Density",
        },
        cafe: {
          gradient: {
            0.2: "#001845",
            0.4: "#023e8a",
            0.6: "#0077b6",
            0.8: "#ff8800",
            1.0: "#e67e22",
          },
          label: "☕ Cafe Density",
        },
        laundry: {
          gradient: {
            0.2: "#001d3d",
            0.4: "#003566",
            0.6: "#0077b6",
            0.8: "#00b4d8",
            1.0: "#90e0ef",
          },
          label: "👕 Laundry Density",
        },
        mamak: {
          gradient: {
            0.2: "#1b4332",
            0.4: "#2d6a4f",
            0.6: "#52b788",
            0.8: "#95d5b2",
            1.0: "#2ecc71",
          },
          label: "🍜 Mamak Density",
        },
        clinic: {
          gradient: {
            0.2: "#10002b",
            0.4: "#3c096c",
            0.6: "#7b2d8b",
            0.8: "#c77dff",
            1.0: "#9b59b6",
          },
          label: "🏥 Clinic Density",
        },
        gym: {
          gradient: {
            0.2: "#7f4f24",
            0.4: "#b6811a",
            0.6: "#e9c46a",
            0.8: "#f4a261",
            1.0: "#f39c12",
          },
          label: "💪 Gym Density",
        },
        convenience: {
          gradient: {
            0.2: "#004b3a",
            0.4: "#007f5f",
            0.6: "#00b87c",
            0.8: "#1abc9c",
            1.0: "#20e0a0",
          },
          label: "🏪 Convenience Density",
        },
      };

      function showLayer(key) {
        if (currentLayer) map.removeLayer(currentLayer);

        const pts = data[key];
        const cfg = layerConfig[key];

        currentLayer = L.heatLayer(pts, {
          radius: 35,
          blur: 25,
          maxZoom: 15,
          max: 1.0,
          gradient: cfg.gradient,
        }).addTo(map);

        document.getElementById("legend-title").textContent = cfg.label;
      }

      // ──────────────────────────────────────────
      // FILTER BUTTON WIRING
      // ──────────────────────────────────────────
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          showLayer(btn.dataset.key);
        });
      });

      // Initial load
      showLayer("house_price");

      // ──────────────────────────────────────────
      // AREA LABELS (subtle markers)
      // ──────────────────────────────────────────
      const areaLabels = [
        // City core
        { pos: areas.klcc,           name: "KLCC" },
        { pos: areas.bukit_bintang,  name: "Bukit Bintang" },
        { pos: areas.chow_kit,       name: "Chow Kit" },
        { pos: areas.brickfields,    name: "Brickfields" },
        { pos: areas.masjid_india,   name: "Masjid India" },
        // South KL
        { pos: areas.mid_valley,     name: "Mid Valley" },
        { pos: areas.bangsar,        name: "Bangsar" },
        { pos: areas.bangsar_south,  name: "Bangsar South" },
        { pos: areas.sri_petaling,   name: "Sri Petaling" },
        // North KL
        { pos: areas.mont_kiara,     name: "Mont Kiara" },
        { pos: areas.hartamas,       name: "Hartamas" },
        { pos: areas.kepong,         name: "Kepong" },
        { pos: areas.segambut,       name: "Segambut" },
        // East KL
        { pos: areas.wangsa_maju,    name: "Wangsa Maju" },
        { pos: areas.setapak,        name: "Setapak" },
        { pos: areas.ampang,         name: "Ampang" },
        { pos: areas.cheras,         name: "Cheras" },
        { pos: areas.pandan_indah,   name: "Pandan Indah" },
        // West / PJ
        { pos: areas.ttdi,           name: "TTDI" },
        { pos: areas.pj_ss2,         name: "PJ SS2" },
        { pos: areas.pj_damansara,   name: "PJ Damansara" },
        { pos: areas.subang_jaya,    name: "Subang Jaya" },
        { pos: areas.usj,            name: "USJ" },
        // South
        { pos: areas.puchong,        name: "Puchong" },
        { pos: areas.bukit_jalil,    name: "Bukit Jalil" },
        { pos: areas.seri_kembangan, name: "Seri Kembangan" },
      ];

      areaLabels.forEach(({ pos, name }) => {
        L.marker(pos, {
          icon: L.divIcon({
            className: "",
            html: `<div style="
        color: rgba(255,255,255,0.7);
        font-size: 11px;
        font-weight: 600;
        font-family: 'Segoe UI', sans-serif;
        white-space: nowrap;
        text-shadow: 0 0 6px #000, 0 0 12px #000;
        letter-spacing: 0.5px;
        pointer-events: none;
      ">${name}</div>`,
            iconAnchor: [0, 0],
          }),
        }).addTo(map);
      });
    </script>
  </body>
</html>
