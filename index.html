<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GapMap</title>
    <meta name="description" content="GapMap — find the gaps in any city. Visualise facility density across neighbourhoods: house prices, cafes, clinics, gyms and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg:        #080b12;
        --surface:   #0e1120;
        --surface2:  #151929;
        --border:    rgba(255,255,255,0.07);
        --text:      #f0f2ff;
        --muted:     #6b7280;
        --accent:    #7c6dfa;
        --accent-bg: rgba(124,109,250,0.12);
      }

      body {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── HEADER ─────────────────────────────────────────── */
      header {
        position: relative;
        z-index: 10;
        padding: 0 24px;
        height: 60px;
        background: rgba(14, 17, 32, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0;
        flex-shrink: 0;
      }

      /* wordmark */
      .wordmark {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-right: 24px;
        flex-shrink: 0;
        text-decoration: none;
      }
      .wordmark-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #7c6dfa, #a855f7);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
        box-shadow: 0 0 16px rgba(124,109,250,0.35);
      }
      .wordmark-text {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text);
      }
      .wordmark-text em {
        font-style: normal;
        color: var(--accent);
      }

      /* divider */
      .header-divider {
        width: 1px;
        height: 28px;
        background: var(--border);
        margin-right: 20px;
        flex-shrink: 0;
      }

      /* filter strip */
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
        align-items: center;
        padding: 2px 0;
      }
      .filters::-webkit-scrollbar { display: none; }

      .filter-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
        transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s, transform 0.12s;
        background: rgba(255,255,255,0.05);
        color: var(--muted);
        outline: none;
        flex-shrink: 0;
      }
      .filter-btn:hover {
        background: rgba(255,255,255,0.09);
        color: #c0c8e8;
        transform: translateY(-1px);
      }
      .filter-btn .btn-emoji { font-size: 13px; line-height: 1; }

      /* active states — each layer gets its own accent */
      .filter-btn[data-key="house_price"].active {
        background: rgba(231,76,60,0.15);
        color: #ff6b6b;
        border-color: rgba(231,76,60,0.45);
        box-shadow: 0 0 12px rgba(231,76,60,0.2);
      }
      .filter-btn[data-key="cafe"].active {
        background: rgba(230,126,34,0.15);
        color: #ffab5e;
        border-color: rgba(230,126,34,0.45);
        box-shadow: 0 0 12px rgba(230,126,34,0.2);
      }
      .filter-btn[data-key="laundry"].active {
        background: rgba(52,152,219,0.15);
        color: #74c0fc;
        border-color: rgba(52,152,219,0.45);
        box-shadow: 0 0 12px rgba(52,152,219,0.2);
      }
      .filter-btn[data-key="mamak"].active {
        background: rgba(46,204,113,0.15);
        color: #69db7c;
        border-color: rgba(46,204,113,0.45);
        box-shadow: 0 0 12px rgba(46,204,113,0.2);
      }
      .filter-btn[data-key="clinic"].active {
        background: rgba(155,89,182,0.15);
        color: #cc99ff;
        border-color: rgba(155,89,182,0.45);
        box-shadow: 0 0 12px rgba(155,89,182,0.2);
      }
      .filter-btn[data-key="gym"].active {
        background: rgba(243,156,18,0.15);
        color: #ffd43b;
        border-color: rgba(243,156,18,0.45);
        box-shadow: 0 0 12px rgba(243,156,18,0.2);
      }
      .filter-btn[data-key="convenience"].active {
        background: rgba(26,188,156,0.15);
        color: #63e6be;
        border-color: rgba(26,188,156,0.45);
        box-shadow: 0 0 12px rgba(26,188,156,0.2);
      }

      /* ── MAP ──────────────────────────────────────────────── */
      #map { flex: 1; width: 100%; }

      /* ── LEGEND ───────────────────────────────────────────── */
      .legend {
        position: absolute;
        bottom: 28px;
        right: 16px;
        background: rgba(14, 17, 32, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        z-index: 1000;
        font-size: 11.5px;
        min-width: 170px;
      }
      .legend h4 {
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--text);
        letter-spacing: 0.2px;
      }
      .legend-bar {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(to right, #3b82f680, #22d3ee80, #a3e63580, #facc1580, #f9731680);
        margin-bottom: 7px;
      }
      .legend-labels {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }

      /* ── INFO PANEL ───────────────────────────────────────── */
      .info-panel {
        position: absolute;
        top: 76px;
        left: 16px;
        background: rgba(14, 17, 32, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        z-index: 1000;
        font-size: 12px;
        max-width: 210px;
      }
      .info-panel h4 {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 7px;
        letter-spacing: 0.2px;
      }
      .info-panel p {
        color: #8b95b3;
        line-height: 1.65;
      }
      .info-panel .hint-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        font-size: 11.5px;
        color: #8b95b3;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-hot  { background: #f97316; box-shadow: 0 0 6px #f97316aa; }
      .dot-cold { background: #3b82f6; box-shadow: 0 0 6px #3b82f6aa; }
      .info-panel .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--accent-bg);
        border: 1px solid rgba(124,109,250,0.25);
        color: var(--accent);
        margin-top: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="wordmark" href="#">
        <div class="wordmark-icon">🗺️</div>
        <span class="wordmark-text">Gap<em>Map</em></span>
      </a>
      <div class="header-divider"></div>
      <div class="filters">
        <button class="filter-btn active" data-key="house_price"><span class="btn-emoji">🏠</span> House Price</button>
        <button class="filter-btn" data-key="cafe"><span class="btn-emoji">☕</span> Cafes</button>
        <button class="filter-btn" data-key="laundry"><span class="btn-emoji">👕</span> Laundry</button>
        <button class="filter-btn" data-key="mamak"><span class="btn-emoji">🍜</span> Street Food</button>
        <button class="filter-btn" data-key="clinic"><span class="btn-emoji">🏥</span> Clinics</button>
        <button class="filter-btn" data-key="gym"><span class="btn-emoji">💪</span> Gyms</button>
        <button class="filter-btn" data-key="convenience"><span class="btn-emoji">🏪</span> Convenience</button>
      </div>
    </header>

    <div id="map"></div>

    <div class="legend">
      <h4 id="legend-title">🏠 House Price Density</h4>
      <div class="legend-bar"></div>
      <div class="legend-labels"><span>Low</span><span>High</span></div>
    </div>

    <div class="info-panel">
      <h4>💡 How to use</h4>
      <p>Pick a layer to see facility density across the city.</p>
      <div class="hint-row"><div class="dot dot-hot"></div> <span><b>Hot</b> = high density</span></div>
      <div class="hint-row"><div class="dot dot-cold"></div> <span><b>Cool</b> = gap / missing</span></div>
      <div class="badge">✦ Hackathon Demo</div>
    </div>

    <script>
      // ──────────────────────────────────────────
      // MAP INIT
      // ──────────────────────────────────────────
      const map = L.map("map", { zoomControl: true }).setView(
        [3.139, 101.6869],
        12,
      );

      // Esri dark basemap: no API key, no Referer needed (OSM blocks file:// opens with "Access blocked")
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors",
          maxZoom: 16,
        },
      ).addTo(map);

      // ──────────────────────────────────────────
      // DATA GENERATOR
      // Clusters of points around area landmarks
      // ──────────────────────────────────────────
      function jitter(lat, lng, n, spread, intensity) {
        const pts = [];
        for (let i = 0; i < n; i++) {
          pts.push([
            lat + (Math.random() - 0.5) * spread,
            lng + (Math.random() - 0.5) * spread,
            intensity * (0.5 + Math.random() * 0.5),
          ]);
        }
        return pts;
      }

      // Area centres — KL + Klang Valley: [lat, lng]
      const areas = {
        // ── City core ──
        klcc:           [3.1578,  101.7119],
        bukit_bintang:  [3.1466,  101.7100],
        chow_kit:       [3.1659,  101.6986],
        brickfields:    [3.1316,  101.6862],
        masjid_india:   [3.1490,  101.6940],
        // ── South KL ──
        mid_valley:     [3.1178,  101.6774],
        bangsar:        [3.1299,  101.6778],
        bangsar_south:  [3.1080,  101.6640],
        kl_eco_city:    [3.1140,  101.6800],
        sri_petaling:   [3.0850,  101.6900],
        // ── North KL ──
        mont_kiara:     [3.1728,  101.6536],
        hartamas:       [3.1620,  101.6513],
        desa_park:      [3.1335,  101.6564],
        kepong:         [3.2100,  101.6330],
        segambut:       [3.1870,  101.6700],
        // ── East KL ──
        wangsa_maju:    [3.1927,  101.7388],
        setapak:        [3.2020,  101.7102],
        ampang:         [3.1500,  101.7550],
        pandan_indah:   [3.1100,  101.7500],
        cheras:         [3.0790,  101.7380],
        // ── West / PJ ──
        ttdi:           [3.1402,  101.6304],
        pj_ss2:         [3.1099,  101.6244],
        pj_damansara:   [3.1350,  101.6150],
        subang_jaya:    [3.0500,  101.5800],
        usj:            [3.0480,  101.5600],
        // ── South ──
        puchong:        [3.0299,  101.6218],
        bukit_jalil:    [3.0580,  101.6900],
        seri_kembangan: [3.0230,  101.7080],
      };

      // Each facility: dense areas first, then thinning areas (gaps = opportunity)
      const data = {
        // ── House Price ──────────────────────────────────────────────────────
        // Luxury corridor: KLCC → Mont Kiara → Bangsar → Damansara
        house_price: [
          ...jitter(...areas.klcc,           100, 0.025, 1.00),
          ...jitter(...areas.mont_kiara,       90, 0.030, 0.95),
          ...jitter(...areas.bukit_bintang,    75, 0.020, 0.90),
          ...jitter(...areas.bangsar,          70, 0.022, 0.88),
          ...jitter(...areas.hartamas,         60, 0.022, 0.82),
          ...jitter(...areas.kl_eco_city,      55, 0.018, 0.80),
          ...jitter(...areas.bangsar_south,    50, 0.020, 0.78),
          ...jitter(...areas.ttdi,             55, 0.020, 0.75),
          ...jitter(...areas.pj_damansara,     50, 0.022, 0.72),
          ...jitter(...areas.desa_park,        45, 0.018, 0.70),
          ...jitter(...areas.bukit_jalil,      40, 0.025, 0.65),
          // Mid tier
          ...jitter(...areas.ampang,           45, 0.025, 0.65),
          ...jitter(...areas.mid_valley,       40, 0.018, 0.62),
          ...jitter(...areas.chow_kit,         35, 0.015, 0.60),
          ...jitter(...areas.subang_jaya,      35, 0.028, 0.58),
          ...jitter(...areas.wangsa_maju,      30, 0.025, 0.55),
          ...jitter(...areas.brickfields,      30, 0.015, 0.55),
          ...jitter(...areas.pandan_indah,     25, 0.022, 0.50),
          // Affordable
          ...jitter(...areas.kepong,           20, 0.030, 0.42),
          ...jitter(...areas.setapak,          20, 0.025, 0.45),
          ...jitter(...areas.segambut,         18, 0.020, 0.40),
          ...jitter(...areas.sri_petaling,     15, 0.020, 0.38),
          ...jitter(...areas.puchong,          15, 0.030, 0.35),
          ...jitter(...areas.cheras,           15, 0.025, 0.38),
          ...jitter(...areas.usj,              12, 0.025, 0.33),
          ...jitter(...areas.seri_kembangan,   10, 0.025, 0.30),
        ],

        // ── Cafes ────────────────────────────────────────────────────────────
        // Cafe culture hotspots: BB, Bangsar, TTDI, Mont Kiara, Hartamas
        cafe: [
          ...jitter(...areas.bukit_bintang,   100, 0.018, 1.00),
          ...jitter(...areas.bangsar,          90, 0.020, 0.95),
          ...jitter(...areas.ttdi,             80, 0.018, 0.90),
          ...jitter(...areas.mont_kiara,       75, 0.022, 0.88),
          ...jitter(...areas.klcc,             70, 0.022, 0.85),
          ...jitter(...areas.hartamas,         65, 0.020, 0.82),
          ...jitter(...areas.desa_park,        60, 0.018, 0.78),
          ...jitter(...areas.pj_damansara,     55, 0.022, 0.75),
          ...jitter(...areas.mid_valley,       50, 0.015, 0.72),
          ...jitter(...areas.subang_jaya,      45, 0.025, 0.68),
          ...jitter(...areas.bangsar_south,    40, 0.020, 0.65),
          ...jitter(...areas.bukit_jalil,      35, 0.022, 0.60),
          ...jitter(...areas.pandan_indah,     30, 0.022, 0.55),
          ...jitter(...areas.ampang,           30, 0.025, 0.52),
          // Gaps
          ...jitter(...areas.kepong,           12, 0.030, 0.22),
          ...jitter(...areas.setapak,          10, 0.025, 0.18),
          ...jitter(...areas.chow_kit,         15, 0.015, 0.25),
          ...jitter(...areas.segambut,          8, 0.020, 0.15),
          ...jitter(...areas.cheras,           10, 0.025, 0.20),
          ...jitter(...areas.puchong,           8, 0.030, 0.15),
          ...jitter(...areas.usj,              10, 0.025, 0.18),
          ...jitter(...areas.sri_petaling,      8, 0.020, 0.15),
          ...jitter(...areas.seri_kembangan,    5, 0.025, 0.10),
          ...jitter(...areas.masjid_india,     12, 0.015, 0.22),
        ],

        // ── Laundry ──────────────────────────────────────────────────────────
        // Dense in high-density residential / student areas
        laundry: [
          ...jitter(...areas.chow_kit,         80, 0.015, 1.00),
          ...jitter(...areas.wangsa_maju,       75, 0.025, 0.95),
          ...jitter(...areas.setapak,           70, 0.025, 0.90),
          ...jitter(...areas.kepong,            65, 0.030, 0.85),
          ...jitter(...areas.pj_ss2,            60, 0.028, 0.80),
          ...jitter(...areas.puchong,           55, 0.030, 0.75),
          ...jitter(...areas.sri_petaling,      50, 0.020, 0.72),
          ...jitter(...areas.subang_jaya,       50, 0.025, 0.70),
          ...jitter(...areas.usj,               45, 0.025, 0.68),
          ...jitter(...areas.cheras,            45, 0.025, 0.65),
          ...jitter(...areas.ampang,            40, 0.025, 0.62),
          ...jitter(...areas.brickfields,       40, 0.015, 0.65),
          ...jitter(...areas.segambut,          35, 0.020, 0.60),
          ...jitter(...areas.seri_kembangan,    30, 0.025, 0.55),
          ...jitter(...areas.masjid_india,      30, 0.015, 0.58),
          ...jitter(...areas.pandan_indah,      30, 0.022, 0.55),
          // Gaps — upscale areas rely on hotel/concierge laundry
          ...jitter(...areas.mont_kiara,         6, 0.022, 0.10),
          ...jitter(...areas.bangsar,            8, 0.020, 0.12),
          ...jitter(...areas.ttdi,              10, 0.018, 0.18),
          ...jitter(...areas.hartamas,           5, 0.022, 0.10),
          ...jitter(...areas.desa_park,          6, 0.018, 0.12),
          ...jitter(...areas.kl_eco_city,        5, 0.015, 0.10),
          ...jitter(...areas.bangsar_south,      6, 0.020, 0.12),
          ...jitter(...areas.pj_damansara,       8, 0.022, 0.15),
        ],

        // ── Street Food (Mamak / Hawker) ─────────────────────────────────────
        // Everywhere but thinner in expat / luxury zones
        mamak: [
          ...jitter(...areas.chow_kit,         110, 0.015, 1.00),
          ...jitter(...areas.kepong,            90, 0.030, 0.95),
          ...jitter(...areas.setapak,           85, 0.025, 0.90),
          ...jitter(...areas.wangsa_maju,       80, 0.025, 0.88),
          ...jitter(...areas.pj_ss2,            75, 0.028, 0.85),
          ...jitter(...areas.bukit_bintang,     65, 0.018, 0.80),
          ...jitter(...areas.ampang,            60, 0.025, 0.78),
          ...jitter(...areas.mid_valley,        55, 0.015, 0.75),
          ...jitter(...areas.brickfields,       60, 0.015, 0.80),
          ...jitter(...areas.masjid_india,      70, 0.015, 0.88),
          ...jitter(...areas.cheras,            60, 0.025, 0.75),
          ...jitter(...areas.segambut,          55, 0.020, 0.72),
          ...jitter(...areas.subang_jaya,       55, 0.025, 0.70),
          ...jitter(...areas.puchong,           50, 0.030, 0.68),
          ...jitter(...areas.bukit_jalil,       45, 0.025, 0.65),
          ...jitter(...areas.usj,               45, 0.025, 0.62),
          ...jitter(...areas.sri_petaling,      45, 0.020, 0.65),
          ...jitter(...areas.seri_kembangan,    35, 0.025, 0.55),
          ...jitter(...areas.pandan_indah,      40, 0.022, 0.60),
          // Gaps — low street food in premium residential
          ...jitter(...areas.mont_kiara,         8, 0.022, 0.12),
          ...jitter(...areas.bangsar,           12, 0.020, 0.18),
          ...jitter(...areas.ttdi,              10, 0.018, 0.15),
          ...jitter(...areas.hartamas,           7, 0.022, 0.12),
          ...jitter(...areas.desa_park,          6, 0.018, 0.10),
          ...jitter(...areas.kl_eco_city,        8, 0.015, 0.12),
          ...jitter(...areas.bangsar_south,      8, 0.020, 0.12),
          ...jitter(...areas.pj_damansara,      10, 0.022, 0.15),
        ],

        // ── Clinics ──────────────────────────────────────────────────────────
        // Good coverage near commercial hubs, gaps in outer residential
        clinic: [
          ...jitter(...areas.klcc,              65, 0.022, 0.92),
          ...jitter(...areas.bukit_bintang,      60, 0.018, 0.88),
          ...jitter(...areas.mid_valley,         70, 0.015, 1.00),
          ...jitter(...areas.bangsar,            55, 0.020, 0.85),
          ...jitter(...areas.pj_ss2,             55, 0.028, 0.80),
          ...jitter(...areas.wangsa_maju,        50, 0.025, 0.78),
          ...jitter(...areas.ampang,             50, 0.025, 0.75),
          ...jitter(...areas.subang_jaya,        50, 0.025, 0.75),
          ...jitter(...areas.brickfields,        45, 0.015, 0.78),
          ...jitter(...areas.masjid_india,       45, 0.015, 0.75),
          ...jitter(...areas.cheras,             45, 0.025, 0.72),
          ...jitter(...areas.pj_damansara,       40, 0.022, 0.70),
